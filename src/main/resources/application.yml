server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parking_fag}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
parking:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  source: ${MONITOR_SOURCE:parking-video}
  stale-seconds: ${MONITOR_STALE_SECONDS:45}
  log-retention-days: ${LOG_RETENTION_DAYS:7}
  remove-missing: ${REMOVE_MISSING_SPOTS:false}
  api-key: ${INGEST_API_KEY:}
